[workspace]
members = [
    "crates/liveactivity",
    "fixtures/mock-framework-plugin",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["1eedaegon"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1eedaegon/liveactivity-rs"

[workspace.dependencies]
activitykit = "0.1"
futures-executor = "0.3"
liveupdate = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
