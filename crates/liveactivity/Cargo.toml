[package]
name = "liveactivity"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/liveactivity"
description = "Framework-neutral Live Activities: one interface over ActivityKit, Android Live Updates and other backends"
keywords = ["live-activity", "activitykit", "dynamic-island", "android", "ios"]
categories = ["api-bindings", "os"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["app"]
# The application's side: `LiveActivity`, the backends and the events.
app = []
# liveupdate's push entry, exported from the host's library: a data message from the server reaches the
# lifecycle while the application does not run (Android).
android-push = ["app", "liveupdate/push"]
# The sender of pushes to APNs, for a server; `liveactivity::push` is there without it.
server = ["dep:jsonwebtoken", "dep:reqwest"]
# The conformance suite and a backend without a platform, for tests.
testkit = ["app"]

[[example]]
name = "usage"
required-features = ["testkit"]

[[example]]
name = "adapter"
required-features = ["testkit"]

[[example]]
name = "features"
required-features = ["testkit"]

[[example]]
name = "push_server"
required-features = ["server"]

[dependencies]
activitykit.workspace = true
liveupdate = { workspace = true, features = ["android"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
futures-executor.workspace = true
jsonwebtoken.workspace = true
liveactivity = { path = ".", default-features = false, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
wiremock.workspace = true

[lints]
workspace = true
