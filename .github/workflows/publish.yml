name: Release

# A `v*` tag validates the release and creates its GitHub release: the tag matches the crate's version, main's CI
# passed for the tag's exact commit, the tests pass and the crate packages. The post-CI coordinator dispatches this
# workflow with `publish` checked after creating a validated tag. A manual run can use the same input for recovery.
# Publishing also requires the repository variable CRATES_IO_PUBLISH to be `true` and the `crates-io` environment.
# Trusted Publishing on crates.io must name this repository, publish.yml and that environment.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Publish the validated version to crates.io
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TOOLCHAIN: 1.96.0

jobs:
  validate:
    name: Validate the release
    if: github.repository == '1eedaegon/liveactivity-rs'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
      - name: The tag, the version, and main's CI for the exact commit
        id: guard
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' || { echo "not a vSEMVER tag: $TAG"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "liveactivity") | .version')
          [ "v$version" = "$TAG" ] || { echo "Cargo.toml has $version, the tag is $TAG"; exit 1; }
          sha=$(git rev-parse "$TAG^{commit}")
          git fetch --quiet origin main
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main"; exit 1; }
          runs=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          [ "$runs" -gt 0 ] || { echo "no successful CI run on main for $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo test --locked --workspace --all-features
      # Builds the packaged crate from its .crate file, as crates.io would get it.
      - run: cargo package --locked -p liveactivity

  # The GitHub release of the tag, with the changelog section of its version as notes.
  release:
    name: Create the GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create the release when it is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a release"
            exit 0
          fi
          tools/release.sh notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  crates-io:
    name: Publish to crates.io
    needs: [validate, release]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && vars.CRATES_IO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal && rustup default "$TOOLCHAIN"
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked -p liveactivity
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
