name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: 1.96.0

jobs:
  quality:
    name: Contract and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - run: rustup default "$TOOLCHAIN"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace
      # REQ-N-004: the host contract and adapter fixture stay above 80 percent line coverage.
      - run: cargo llvm-cov --locked --workspace --all-features --summary-only --fail-under-lines 80
      - run: bash tools/check-requirements.sh
      - name: Keep the core framework-neutral
        # REQ-N-001 and REQ-I-001: framework and build integration stay outside the core.
        run: |
          if cargo tree -p liveactivity-core -e normal --prefix none | grep -Eiq '(^| )(tauri|wry|dioxus|slint)( |$)'; then
            echo 'liveactivity-core contains a framework dependency'
            exit 1
          fi

  msrv:
    name: Rust 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 check --locked --workspace --all-targets
