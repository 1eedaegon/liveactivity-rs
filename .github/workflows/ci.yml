name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN: 1.96.0

jobs:
  quality:
    name: Contract and quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - run: rustup default "$TOOLCHAIN"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo llvm-cov --locked --workspace --all-features --summary-only --fail-under-lines 80
      - run: bash tools/check-requirements.sh
      - run: bash tests/release/run.sh
      # The JNI path of the Android backend compiles only for Android.
      - run: rustup target add aarch64-linux-android
      - run: cargo check --locked -p liveactivity --target aarch64-linux-android

  msrv:
    name: Rust 1.90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: cargo +1.90.0 check --locked --workspace --all-targets
