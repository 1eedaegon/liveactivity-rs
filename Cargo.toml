[workspace]
members = [
    "crates/liveactivity",
]
resolver = "3"

[workspace.package]
version = "0.16.1"
authors = ["1eedaegon"]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/1eedaegon/liveactivity-rs"

[workspace.dependencies]
activitykit = "0.9.3"
aws-lc-rs = "1.19.0"
axum = "0.8.9"
base64 = "0.23.1"
futures-executor = "0.3"
# The sender's: one crypto provider, aws-lc-rs, for TLS and for the signatures.
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
liveupdate = "0.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tokio = "1.54.1"
wiremock = "0.6.5"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
