[package]
name = "liveactivity"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Framework-neutral Live Activities: one interface over ActivityKit, Android Live Updates and other backends"
keywords = ["live-activity", "activitykit", "android", "plugin"]
categories = ["api-bindings", "os"]

[features]
# The conformance suite and a backend without a platform, for tests.
testkit = []

[[example]]
name = "usage"
required-features = ["testkit"]

[dependencies]
activitykit.workspace = true
liveupdate = { workspace = true, features = ["android"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
futures-executor.workspace = true
liveactivity = { path = ".", default-features = false, features = ["testkit"] }

[lints]
workspace = true
